<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Καιρός Ιεράπετρας</title>
<style>
  :root { --bg:#f3efe6; --ink:#12303b; --muted:#5d7580; --card:#fffdf8; --line:#d9d2c0; --sea:#0b6f8a; --ok:#2e7d5b; --mid:#c58a1b; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1d24; --ink:#e8f1f3; --muted:#8fa8b1; --card:#142932; --line:#24424d; --sea:#4cc3df; --ok:#5fc59a; --mid:#e0ac3f; --bad:#f2766e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--ink);
         font-family: Georgia, "Times New Roman", serif; line-height:1.5; max-width:520px; margin-inline:auto; }
  .banner { display:block; width:100%; height:auto; border-radius:12px; margin:0 0 18px; }
  header { margin:8px 0 22px; color:var(--sea); }
  h1 { font-size:3rem; font-weight:normal; font-style:italic; letter-spacing:-.02em; line-height:1; margin:0; color:var(--ink); }
  .wave { display:block; width:100%; height:18px; margin:8px 0 6px; }
  .sub { color:var(--muted); font-size:.95rem; }
  .arrow { display:inline-block; font-style:normal; color:var(--sea); }
  .now { border:2px solid var(--sea); border-radius:12px; padding:14px 16px; margin-bottom:18px; background:var(--card); }
  .now h2 { font-size:1rem; margin:0 0 2px; }
  .now .big { font-size:3rem; color:var(--sea); line-height:1.1; }
  .src { margin-top:8px; font-size:.8rem; color:var(--muted); }
  .day { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:12px; }
  .day.ok { border-left-color:var(--ok); } .day.mid { border-left-color:var(--mid); } .day.bad { border-left-color:var(--bad); }
  .head { display:flex; justify-content:space-between; align-items:baseline; }
  .head h2 { font-size:1rem; margin:0; text-transform:capitalize; }
  .icon { font-size:1.6rem; }
  .temp { font-size:2.1rem; color:var(--sea); line-height:1.2; }
  .temp small { font-size:1rem; color:var(--muted); }
  .row { font-size:.95rem; }
  .warn { color:var(--bad); font-weight:bold; }
  .conf { margin-top:6px; font-size:.85rem; color:var(--muted); }
  details { margin-top:8px; font-size:.85rem; }
  summary { cursor:pointer; color:var(--muted); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; margin-top:6px; }
  td, th { text-align:left; padding:3px 4px; border-bottom:1px solid var(--line); font-weight:normal; white-space:nowrap; }
  th { color:var(--muted); }
  .note { font-size:.8rem; color:var(--muted); margin-top:14px; }
  .err { color:var(--bad); }
</style>
</head>

<script>
const LAT = 35.01, LON = 25.74;
const GUST_WARN = 50; // km/h: από εδώ και πάνω οι ριπές σημειώνονται με ⚠

const MODELS = {
  ecmwf_ifs025: "ECMWF",
  gfs_seamless: "GFS",
  icon_seamless: "ICON",
  icon_eu: "ICON-EU",
  meteofrance_seamless: "Météo-France",
  ukmo_seamless: "UK Met"
};
const KEYS = Object.keys(MODELS);

// ---------- βοηθητικά ----------
function avg(list) {
  const v = list.filter(x => x != null);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
// σταθμισμένος μέσος όρος (αγνοεί κενά)
function wavg(vals, ws) {
  let s = 0, t = 0;
  vals.forEach((v, i) => { if (v != null) { s += v * ws[i]; t += ws[i]; } });
  return t ? s / t : null;
}
// μέσος όρος διευθύνσεων ανέμου (κυκλικός, όχι απλός)
function dirMean(degs, ws) {
  let x = 0, y = 0;
  degs.forEach((d, i) => { if (d != null) { x += ws[i] * Math.sin(d * Math.PI / 180); y += ws[i] * Math.cos(d * Math.PI / 180); } });
  if (!x && !y) return null;
  return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
}
function compass(deg) {
  return ["Β","ΒΑ","Α","ΝΑ","Ν","ΝΔ","Δ","ΒΔ"][Math.round(deg / 45) % 8];
}
// Η διεύθυνση ανέμου είναι από πού φυσάει· το βέλος δείχνει προς πού φυσάει.
function arrow(deg) {
  return deg == null ? "" : `<i class="arrow" style="transform:rotate(${(deg + 180) % 360}deg)">↑</i>`;
}
function windText(deg) {
  return deg == null ? "" : `${arrow(deg)} ${compass(deg)} `;
}
function confidence(maxTemps) {
  const v = maxTemps.filter(x => x != null);
  if (v.length < 2) return ["", "χωρίς αρκετά δεδομένα"];
  const spread = Math.max(...v) - Math.min(...v);
  if (spread <= 2) return ["ok", "Τα μοντέλα συμφωνούν"];
  if (spread <= 4) return ["mid", "Μικρή διαφωνία μεταξύ μοντέλων"];
  return ["bad", "Τα μοντέλα διαφωνούν αρκετά"];
}
function icon(rain, gust) {
  if (rain >= 5) return "🌧️";
  if (rain >= 1) return "🌦️";
  return gust >= GUST_WARN ? "💨" : "☀️";
}

// ---------- στάθμιση μοντέλων ----------
// Συγκρίνουμε τι είπε κάθε μοντέλο τις ημέρες 20 έως 6 πριν με την ανάλυση ERA5
// (δεν είναι σταθμός, είναι η καλύτερη διαθέσιμη "πραγματικότητα" προς το παρόν).
// Όταν αποκτήσεις σταθμό, εδώ αλλάζει η πηγή της "πραγματικότητας".
async function getWeights() {
  const ones = Object.fromEntries(KEYS.map(m => [m, 1]));
  try {
    const f = d => d.toISOString().slice(0, 10), day = 864e5;
    const loc = `?latitude=${LAT}&longitude=${LON}`;
    const range = `&start_date=${f(new Date(Date.now() - 20 * day))}&end_date=${f(new Date(Date.now() - 6 * day))}`;
    const vars = "&daily=temperature_2m_max,wind_speed_10m_max&timezone=Europe%2FAthens";
    const [ref, hist] = await Promise.all([
      fetch("https://archive-api.open-meteo.com/v1/archive" + loc + range + vars).then(r => r.json()),
      fetch("https://historical-forecast-api.open-meteo.com/v1/forecast" + loc + range + vars + "&models=" + KEYS.join(",")).then(r => r.json())
    ]);
    const raw = {};
    for (const m of KEYS) {
      const t = hist.daily?.[`temperature_2m_max_${m}`], w = hist.daily?.[`wind_speed_10m_max_${m}`];
      if (!t || !w) continue;
      const eT = [], eW = [];
      ref.daily.time.forEach((_, i) => {
        const rt = ref.daily.temperature_2m_max[i], rw = ref.daily.wind_speed_10m_max[i];
        if (t[i] != null && rt != null) eT.push(Math.abs(t[i] - rt));
        if (w[i] != null && rw != null) eW.push(Math.abs(w[i] - rw));
      });
      if (eT.length < 5 || eW.length < 5) continue;
      raw[m] = 1 / (avg(eT) + avg(eW) / 5 + 0.5); // μικρότερο λάθος = μεγαλύτερο βάρος
    }
    const ok = Object.keys(raw);
    if (ok.length < 2) return { w: ones, ok: false };
    const mean = avg(ok.map(k => raw[k]));
    const w = { ...ones };
    ok.forEach(k => { w[k] = raw[k] / mean; });
    return { w, ok: true };
  } catch (e) {
    return { w: ones, ok: false };
  }
}

// ---------- πρόγνωση ----------
async function load() {
  const app = document.getElementById("app");
  const url = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${LAT}&longitude=${LON}`
    + "&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant"
    + `&models=${KEYS.join(",")}&timezone=Europe%2FAthens&forecast_days=5`;
  try {
    const [res, weights] = await Promise.all([fetch(url), getWeights()]);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = (await res.json()).daily;
    const W = KEYS.map(m => weights.w[m]);
    const vals = (field, i) => KEYS.map(m => d[`${field}_${m}`]?.[i] ?? null);
    app.innerHTML = "";

    d.time.forEach((day, i) => {
      const tmax = vals("temperature_2m_max", i), tmin = vals("temperature_2m_min", i);
      const rain = vals("precipitation_sum", i), wind = vals("wind_speed_10m_max", i);
      const gust = vals("wind_gusts_10m_max", i), dir = vals("wind_direction_10m_dominant", i);

      const rainAvg = wavg(rain, W), gustAvg = wavg(gust, W), dirAvg = dirMean(dir, W);
      const wet = rain.filter(x => x != null && x >= 1).length, total = rain.filter(x => x != null).length;
      const [cls, confText] = confidence(tmax);
      const label = new Date(day).toLocaleDateString("el-GR", { weekday: "long", day: "numeric", month: "long" });
      const gustHtml = gustAvg >= GUST_WARN
        ? `<span class="warn">⚠ ριπές έως ${Math.round(gustAvg)} km/h</span>` : `ριπές έως ${Math.round(gustAvg)} km/h`;

      const rows = KEYS.map((m, k) =>
        `<tr><td>${MODELS[m]}</td><td>${tmax[k] ?? "–"}°</td><td>${rain[k] ?? "–"} mm</td>
         <td>${windText(dir[k])}${wind[k] ?? "–"}</td><td>${gust[k] ?? "–"}</td><td>${W[k].toFixed(1)}</td></tr>`).join("");

      app.insertAdjacentHTML("beforeend", `
        <div class="day ${cls}">
          <div class="head"><h2>${label}</h2><span class="icon">${icon(rainAvg, gustAvg)}</span></div>
          <div class="temp">${Math.round(wavg(tmax, W))}° <small>/ ${Math.round(wavg(tmin, W))}°</small></div>
          <div class="row">${wet === 0 ? "Χωρίς βροχή" : `Βροχή ~${rainAvg.toFixed(1)} mm (${wet}/${total} μοντέλα)`}</div>
          <div class="row">${windText(dirAvg)}${Math.round(wavg(wind, W))} km/h, ${gustHtml}</div>
          <div class="conf">${confText}</div>
          <details><summary>Δες κάθε μοντέλο</summary>
            <div class="scroll"><table>
              <tr><th>Μοντέλο</th><th>Μέγ.</th><th>Βροχή</th><th>Άνεμος km/h</th><th>Ριπές</th><th>Βάρος</th></tr>${rows}
            </table></div>
          </details>
        </div>`);
    });
    document.getElementById("note").textContent = weights.ok
      ? "Τα μοντέλα που πέτυχαν καλύτερα τις τελευταίες εβδομάδες μετρούν περισσότερο (σύγκριση με ανάλυση ERA5, όχι με σταθμό). Το χρώμα στα αριστερά δείχνει πόσο συμφωνούν τα μοντέλα."
      : "Δεν υπολογίστηκαν βάρη, οπότε όλα τα μοντέλα μετρούν το ίδιο. Το χρώμα στα αριστερά δείχνει πόσο συμφωνούν.";
  } catch (e) {
    app.innerHTML = `<p class="err">Δεν φόρτωσαν τα δεδομένα (${e.message}). Έλεγξε τη σύνδεσή σου και ξαναδοκίμασε.</p>`;
  }
}

// ---------- ΤΩΡΑ ----------
// Οι πηγές δοκιμάζονται με τη σειρά. Όταν αποκτήσεις σταθμό, γράφουμε μια συνάρτηση
// σαν την fetchOpenMeteoNow και τη βάζουμε ΠΡΩΤΗ στη λίστα NOW_SOURCES.
async function fetchOpenMeteoNow() {
  const u = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${LAT}&longitude=${LON}`
    + "&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m"
    + "&timezone=Europe%2FAthens";
  const res = await fetch(u);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const c = (await res.json()).current;
  return { source: "Εκτίμηση μοντέλου (Open-Meteo), όχι μέτρηση σταθμού", time: c.time,
    temp: c.temperature_2m, humidity: c.relative_humidity_2m, wind: c.wind_speed_10m,
    gust: c.wind_gusts_10m, dir: c.wind_direction_10m, rain: c.precipitation };
}
const NOW_SOURCES = [fetchOpenMeteoNow];

async function loadNow() {
  const box = document.getElementById("now");
  for (const getSource of NOW_SOURCES) {
    try {
      const n = await getSource();
      const when = new Date(n.time).toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit" });
      box.innerHTML = `
        <div class="now">
          <h2>Τώρα στην Ιεράπετρα</h2>
          <div class="big">${Math.round(n.temp)}°</div>
          <div class="row">Υγρασία ${n.humidity}%, βροχή ${n.rain} mm</div>
          <div class="row">Άνεμος ${windText(n.dir)}${Math.round(n.wind)} km/h, ριπές ${Math.round(n.gust)} km/h</div>
          <div class="src">${n.source} · ${when}</div>
        </div>`;
      return;
    } catch (e) { /* επόμενη πηγή */ }
  }
  box.innerHTML = `<p class="err">Δεν φόρτωσαν οι τρέχουσες συνθήκες.</p>`;
}

load();
loadNow();
</script>
